<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Audit · Sports Radar</title><link rel="stylesheet" href="../styles.css"><style>
.audit{max-width:1100px;margin:0 auto;padding:24px}.audit-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.audit-head h1{margin:0}.audit-tools{display:flex;gap:8px;align-items:center}.audit-tools input,.audit button{font:inherit;padding:8px 12px}.audit-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:22px 0}.audit-stat,.audit-detail{background:var(--surface,#fff);border:1px solid var(--line,#ddd);border-radius:12px;padding:14px}.audit-stat b{display:block;font-size:1.35rem;margin-top:5px}.audit-scroll{overflow:auto}.audit table{border-collapse:collapse;width:100%;min-width:760px}.audit th,.audit td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line,#ddd)}.audit tbody tr{cursor:pointer}.audit tbody tr:hover{background:rgba(120,140,180,.08)}.audit-rating{font-weight:700}.audit-labels{display:flex;gap:5px}.audit-labels button[aria-pressed=true]{outline:2px solid currentColor}.audit-detail{margin-top:18px}.audit-timeline{width:100%;height:90px}.audit-timeline polyline{fill:none;stroke:currentColor;stroke-width:2}.audit-snap{padding:8px 0;border-top:1px solid var(--line,#ddd)}.audit-error{color:#a22}@media(max-width:640px){.audit{padding:16px}}
</style></head><body><main class="audit"><header class="audit-head"><div><a href="../">← Sports Radar</a><h1>Scoring Audit</h1><p>Review completed games and label ratings for calibration.</p></div><div class="audit-tools"><label for="audit-date">Game date</label><input id="audit-date" type="date"><button id="audit-load">Load</button></div></header><section id="audit-stats" class="audit-stats" aria-live="polite"></section><p id="audit-status" role="status">Loading…</p><div class="audit-scroll"><table><thead><tr><th>Game</th><th>Final Score</th><th>Pregame Rating</th><th>Peak Live Rating</th><th>Final Rating</th><th>Model Version</th><th>Label</th></tr></thead><tbody id="audit-games"></tbody></table></div><section id="audit-detail" class="audit-detail" hidden></section></main><script src="../alert-config.js"></script><script src="audit.js"></script></body></html>
